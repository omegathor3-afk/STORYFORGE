name: Build Standalone Story APK

on:
  workflow_dispatch:
    inputs:
      storygame_url:
        description: HTTPS download link to one exported .storygame ZIP
        required: true
        type: string
      game_title:
        description: Name shown under the installed app icon
        required: true
        type: string
      application_id:
        description: Unique Android package ID (for example com.studio.mygame)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build identity
        shell: bash
        env:
          GAME_TITLE: ${{ inputs.game_title }}
          APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          python - <<'PY'
          import os, re, sys
          title = os.environ["GAME_TITLE"].strip()
          package = os.environ["APPLICATION_ID"].strip()
          if not title or len(title) > 40:
              sys.exit("Game title must contain 1-40 characters")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*){1,5}", package):
              sys.exit("Invalid Android application ID")
          if package == "com.storyforge.player":
              sys.exit("Standalone games must use a unique application ID")
          PY

      - name: Prepare and validate game package
        env:
          STORYGAME_URL: ${{ inputs.storygame_url }}
          GAME_TITLE: ${{ inputs.game_title }}
        run: python3 scripts/prepare_standalone_game.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build dedicated game APK
        env:
          GAME_TITLE: ${{ inputs.game_title }}
          APPLICATION_ID: ${{ inputs.application_id }}
        run: |
          gradle --no-daemon :player:assembleDebug \
            -PgameApplicationId="$APPLICATION_ID" \
            -PgameDisplayName="$GAME_TITLE"

      - name: Publish standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: STORYFORGE-GAME-${{ github.run_number }}
          path: player/build/outputs/apk/debug/player-debug.apk
          if-no-files-found: error
          retention-days: 30
