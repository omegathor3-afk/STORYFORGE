name: Android CI

concurrency:
  group: storyforge-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, feature/starter-project-wizard, feature/library-search, feature/ci-maven-mirror, feature/standalone-apk-pipeline ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate standalone build script syntax
        run: |
          python3 -m py_compile scripts/prepare_standalone_game.py scripts/test_prepare_standalone_game.py
          python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run story engine tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build with Gradle
        run: gradle --no-daemon :app:assembleDebug :player:assembleDebug :academy:assembleDebug

      - name: Preserve generic Player APK
        run: cp player/build/outputs/apk/debug/player-debug.apk player/build/outputs/apk/debug/player-generic-debug.apk

      - name: Create standalone story fixture
        run: python3 scripts/create_ci_storygame_fixture.py

      - name: Embed standalone story fixture
        env:
          STORYGAME_LOCAL_PATH: .ci-fixture.storygame
          GAME_TITLE: CI Story Game
          APPLICATION_ID: com.storyforge.games.ci
          GAME_VERSION_NAME: 1.2.3
          GAME_VERSION_CODE: "2"
        run: python3 scripts/prepare_standalone_game.py

      - name: Build and verify standalone APK configuration
        run: |
          gradle --no-daemon :player:assembleDebug \
            -PgameApplicationId="$APPLICATION_ID" \
            -PgameDisplayName="$GAME_TITLE" \
            -PgameVersionName="$GAME_VERSION_NAME" \
            -PgameVersionCode="$GAME_VERSION_CODE"
          cp player/build/outputs/apk/debug/player-debug.apk player/build/outputs/apk/debug/player-standalone-ci.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "package: name='com.storyforge.games.ci'"
          "$AAPT" dump badging player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "application-label:'CI Story Game'"
          unzip -l player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "assets/default.storygame"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STORYFORGE-PLAYER-ACADEMY-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            player/build/outputs/apk/debug/player-debug.apk
            player/build/outputs/apk/debug/player-generic-debug.apk
            player/build/outputs/apk/debug/player-standalone-ci.apk
            academy/build/outputs/apk/debug/academy-debug.apk
