name: Android CI

concurrency:
  group: storyforge-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, feature/starter-project-wizard, feature/library-search, feature/ci-maven-mirror, feature/standalone-apk-pipeline, feature/cloud-build-center, feature/permanent-screenshot-capture, feature/community-hub-foundation, feature/community-hub-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate standalone build script syntax
        run: |
          python3 -m py_compile scripts/prepare_standalone_game.py scripts/test_prepare_standalone_game.py scripts/create_ci_storygame_fixture.py scripts/capture_storyforge_screenshots.py
          python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Setup Node 20 and typecheck cloud service
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck cloud service
        working-directory: cloud-build-service
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run typecheck

      - name: Test cloud service cursor validation
        working-directory: cloud-build-service
        run: npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.9"
          ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          URLS=(
            "https://mirrors.aliyun.com/gradle/distributions/v8.9.0/gradle-$GRADLE_VERSION-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-$GRADLE_VERSION-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          )
          downloaded=false
          for url in "${URLS[@]}"; do
            echo "Trying Gradle mirror: $url"
            if curl --fail --location --retry 2 --retry-all-errors --retry-delay 3 "$url" --output "$ZIP"; then
              actual_sha256="$(sha256sum "$ZIP" | awk '{print $1}')"
              if [ "$actual_sha256" = "$EXPECTED_SHA256" ]; then
                downloaded=true
                break
              fi
              echo "Checksum mismatch from $url; trying next mirror."
            fi
            rm -f "$ZIP"
          done
          if [ "$downloaded" != true ]; then
            echo "Could not download a verified Gradle $GRADLE_VERSION distribution."
            exit 1
          fi
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: Run story engine tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build with Gradle
        run: gradle --no-daemon :app:assembleDebug :player:assembleDebug :academy:assembleDebug

      - name: Preserve generic Player APK
        run: cp player/build/outputs/apk/debug/player-debug.apk player/build/outputs/apk/debug/player-generic-debug.apk

      - name: Create standalone story fixture
        run: python3 scripts/create_ci_storygame_fixture.py

      - name: Embed standalone story fixture
        env:
          STORYGAME_LOCAL_PATH: .ci-fixture.storygame
          GAME_TITLE: CI Story Game
          APPLICATION_ID: com.storyforge.games.ci
          GAME_VERSION_NAME: 1.2.3
          GAME_VERSION_CODE: "2"
        run: python3 scripts/prepare_standalone_game.py

      - name: Build and verify standalone APK configuration
        run: |
          gradle --no-daemon :player:assembleDebug \
            -PgameApplicationId="$APPLICATION_ID" \
            -PgameDisplayName="$GAME_TITLE" \
            -PgameVersionName="$GAME_VERSION_NAME" \
            -PgameVersionCode="$GAME_VERSION_CODE"
          cp player/build/outputs/apk/debug/player-debug.apk player/build/outputs/apk/debug/player-standalone-ci.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "package: name='com.storyforge.games.ci'"
          "$AAPT" dump badging player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "application-label:'CI Story Game'"
          unzip -l player/build/outputs/apk/debug/player-standalone-ci.apk | grep -F "assets/default.storygame"

      - name: Create temporary CI Release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/storyforge-ci-upload.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "ci-store-password" \
            -keypass "ci-store-password" \
            -alias "storyforge-ci" \
            -dname "CN=STORYFORGE CI" \
            -validity 2 -keyalg RSA -keysize 2048
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "ci-store-password" -alias "storyforge-ci" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_STORE_PASSWORD=ci-store-password"
            echo "ANDROID_KEY_ALIAS=storyforge-ci"
            echo "ANDROID_KEY_PASSWORD=ci-store-password"
          } >> "$GITHUB_ENV"

      - name: Build and verify signed standalone Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :player:assembleRelease \
            -PgameApplicationId="$APPLICATION_ID" \
            -PgameDisplayName="$GAME_TITLE" \
            -PgameVersionName="$GAME_VERSION_NAME" \
            -PgameVersionCode="$GAME_VERSION_CODE"
          APK="player/build/outputs/apk/release/player-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.storyforge.games.ci'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'CI Story Game'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='1.2.3'"
          unzip -Z1 "$APK" | grep -Fx 'assets/default.storygame'
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" player/build/outputs/apk/release/player-standalone-ci-release.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real app screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/capture_storyforge_screenshots.py

      - name: Upload real app screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STORYFORGE-REAL-APP-SCREENSHOTS
          path: screenshots/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STORYFORGE-PLAYER-ACADEMY-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            player/build/outputs/apk/debug/player-debug.apk
            player/build/outputs/apk/debug/player-generic-debug.apk
            player/build/outputs/apk/debug/player-standalone-ci.apk
            player/build/outputs/apk/release/player-standalone-ci-release.apk
            academy/build/outputs/apk/debug/academy-debug.apk
