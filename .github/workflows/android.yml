name: Android CI

concurrency:
  group: storyforge-android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, feature/starter-project-wizard, feature/library-search, feature/ci-maven-mirror, feature/standalone-apk-pipeline ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate standalone build script syntax
        run: python3 -m py_compile scripts/prepare_standalone_game.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run story engine tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build with Gradle
        run: gradle --no-daemon :app:assembleDebug :player:assembleDebug :academy:assembleDebug

      - name: Verify standalone APK configuration
        run: |
          gradle --no-daemon :player:assembleDebug \\
            -PgameApplicationId=com.storyforge.games.ci \\
            -PgameDisplayName="CI Story Game" \\
            -PgameVersionName=1.2.3 \\
            -PgameVersionCode=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STORYFORGE-PLAYER-ACADEMY-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            player/build/outputs/apk/debug/player-debug.apk
            academy/build/outputs/apk/debug/academy-debug.apk
