name: Cloud Build Service Checks

on:
  push:
    branches: [ feature/cloud-build-center ]
    paths:
      - "cloud-build-service/**"
      - ".github/workflows/cloud-build-service.yml"
  pull_request:
    branches: [ feature/cloud-build-center ]
    paths:
      - "cloud-build-service/**"
      - ".github/workflows/cloud-build-service.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-build-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
